name: Deploy both AIIRK sites to GitHub Pages

on:
  push:
    branches:
      - main
      - neon-version
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout classic version
        uses: actions/checkout@v4
        with:
          ref: main
          path: classic-src

      - name: Checkout neon version
        uses: actions/checkout@v4
        with:
          ref: neon-version
          path: neon-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build classic version
        working-directory: classic-src
        env:
          NEXT_PUBLIC_BASE_PATH: /aiirkutsk-ecosystem/classic
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build neon version
        working-directory: neon-src
        env:
          NEXT_PUBLIC_BASE_PATH: /aiirkutsk-ecosystem/neon
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/classic dist/neon
          cp -R classic-src/out/. dist/classic/
          cp -R neon-src/out/. dist/neon/
          cp classic-src/pages/index.html dist/index.html
          touch dist/.nojekyll

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
